<!DOCTYPE html>
<html>
<head>
    <title>FTMS</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-image: url("just.jpeg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        .container {
            width: 900px;
            height: 500px;
            margin: 60px auto;
            display: flex;
            border-radius: 15px;
            overflow: hidden;
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(5px);
        }

        .left {
            width: 50%;
            background: linear-gradient(to bottom, #2c3e8f, #1abc9c);
            color: white;
            text-align: center;
            padding-top: 40px;
        }

        .logo {
            width: 180px;
            margin-bottom: 20px;
            border-radius: 10px;
        }

        .right {
            width: 50%;
            background: white;
            padding: 30px;
            overflow-y: auto;
        }

        .right input, select {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .right button {
            width: 100%;
            padding: 10px;
            background: #2c3e8f;
            color: white;
            border: none;
            border-radius: 5px;
            margin-top: 10px;
            cursor: pointer;
        }

        p {
            text-align: center;
            font-size: 14px;
        }

        .error-msg {
            color: red;
            font-size: 12px;
            margin-top: -5px;
            margin-bottom: 8px;
            text-align: left;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="left">
        <img src="FTMS.jpeg" class="logo">
        <h1>Welcome to FTMS</h1>
        <p>Field Training Management System</p>
    </div>

    <div class="right">
        <div id="loginForm">
            <h2>Sign in</h2>
            <input type="text" id="loginEmail" placeholder="Email">
            <input type="password" id="loginPassword" placeholder="Password">
            <div class="error-msg" id="loginErrorMsg"></div>
            <button onclick="login()">Sign in</button>
            <p>
                Don't have an account?
                <a href="#" onclick="showRegister()">Register</a>
            </p>
        </div>

        <div id="registerForm" style="display:none;">
            <h2>Register</h2>
            <select id="role" onchange="changeForm()">
                <option value="">Select Role</option>
                <option value="student">Student</option>
                <option value="supervisor">Supervisor</option>
                <option value="dean">Dean</option>
                <option value="head">Head of Department</option>
                <option value="company">Company</option>
            </select>

            <div id="studentFields" style="display:none;">
                <input type="text" id="studentId" placeholder="University ID">
                <div class="error-msg" id="studentIdError"></div>
                <input type="text" id="studentEmail" placeholder="University Email">
                <div class="error-msg" id="studentEmailError"></div>
                <input type="text" id="studentName" placeholder="Full Name">
                <div class="error-msg" id="studentNameError"></div>
                <input type="text" id="studentPhone" placeholder="Phone Number">
                <div class="error-msg" id="studentPhoneError"></div>
                <input type="text" id="studentDept" placeholder="Department">
                <div class="error-msg" id="studentDeptError"></div>
            </div>

            <div id="staffFields" style="display:none;">
                <input type="text" id="staffId" placeholder="University ID">
                <div class="error-msg" id="staffIdError"></div>
                <input type="text" id="staffEmail" placeholder="Email">
                <div class="error-msg" id="staffEmailError"></div>
            </div>

            <div id="companyFields" style="display:none;">
                <input type="text" id="commercialNumber" placeholder="Company Commercial Number">
                <div class="error-msg" id="commercialNumberError"></div>
                <input type="text" id="companyName" placeholder="Company Name">
                <div class="error-msg" id="companyNameError"></div>
                <input type="text" id="companyEmail" placeholder="Company Email">
                <div class="error-msg" id="companyEmailError"></div>
                <input type="text" id="companyPhone" placeholder="Company Phone">
                <div class="error-msg" id="companyPhoneError"></div>
                <input type="text" id="companyLocation" placeholder="Company Location">
                <div class="error-msg" id="companyLocationError"></div>
                <input type="text" id="companyField" placeholder="Specialization">
                <div class="error-msg" id="companyFieldError"></div>
            </div>

            <input type="password" id="registerPassword" placeholder="Password">
            <div class="error-msg" id="registerPasswordError"></div>
            <input type="password" id="registerConfirmPassword" placeholder="Confirm Password">
            <div class="error-msg" id="registerConfirmPasswordError"></div>

            <button onclick="register()">Register</button>
            <p>
                Already have an account?
                <a href="#" onclick="showLogin()">Sign in</a>
            </p>
        </div>
    </div>
</div>

<script>
// Optional: we can clear out invalid user data if we want, but DO NOT redirect.
const existingUserStr = localStorage.getItem("user");
if (existingUserStr) {
    try {
        const user = JSON.parse(existingUserStr);
        // Do nothing else. User must explicitly login.
    } catch(e) {
        // Clear corrupted data
        localStorage.removeItem("user");
        localStorage.removeItem("user_id");
        sessionStorage.clear();
    }
}

function showRegister() {
    document.getElementById("loginForm").style.display = "none";
    document.getElementById("registerForm").style.display = "block";
}

function showLogin() {
    document.getElementById("loginForm").style.display = "block";
    document.getElementById("registerForm").style.display = "none";
}

function changeForm() {
    var role = document.getElementById("role").value;
    document.getElementById("studentFields").style.display = "none";
    document.getElementById("staffFields").style.display = "none";
    document.getElementById("companyFields").style.display = "none";

    if (role === "student") {
        document.getElementById("studentFields").style.display = "block";
    } else if (role === "supervisor" || role === "dean" || role === "head") {
        document.getElementById("staffFields").style.display = "block";
    } else if (role === "company") {
        document.getElementById("companyFields").style.display = "block";
    }
}

function login() {
    clearErrors();
    var email = document.getElementById("loginEmail").value;
    var password = document.getElementById("loginPassword").value;

    if (email == "" || password == "") {
        showError("loginErrorMsg", "Enter all fields");
        return;
    }

    console.log("Login request sent for:", email);

    fetch("http://localhost:3000/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email: email, password: password })
    })
    .then(res => res.json())
    .then(data => {
        console.log("Backend response received:", data);
        if (data.message === "Login successful") {
            console.log("User role detected:", data.role);
            // Save complete user info
            const userData = {
                user_id: data.user_id,
                email: data.email,
                role: data.role,
                full_name: data.full_name
            };
            localStorage.setItem("user", JSON.stringify(userData));
            localStorage.setItem("user_id", data.user_id); // legacy support

            let redirectTarget = "";
            if (data.role === "company") {
                redirectTarget = "company-dashboard.html";
            } else if (data.role === "student") {
                redirectTarget = "student-dashboard.html";
            } else if (data.role === "supervisor") {
                redirectTarget = "supervisor-dashboard.html";
            } else if (data.role === "dean") {
                redirectTarget = "dean-dashboard.html";
            }
            
            console.log("Redirect target:", redirectTarget);
            if (redirectTarget) {
                window.location.replace(redirectTarget);
            }
        } else {
            showError("loginErrorMsg", "Wrong email or password");
        }
    })
    .catch(err => {
        console.error("Login fetch error:", err);
        showError("loginErrorMsg", "Server error. Please try again.");
    });
}

function clearErrors() {
    document.querySelectorAll('.error-msg').forEach(el => el.style.display = 'none');
}

function showError(id, msg) {
    var el = document.getElementById(id);
    if (el) {
        el.innerText = msg;
        el.style.display = 'block';
    }
}

function register() {
    clearErrors();
    var role = document.getElementById("role").value;
    var password = document.getElementById("registerPassword").value;
    var confirmPassword = document.getElementById("registerConfirmPassword").value;
    var userData = {};
    var hasError = false;

    if (role === "") {
        alert("Select role");
        return;
    }

    const passwordRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[\W_]).+$/;
    if (!password) {
        showError("registerPasswordError", "Password is required");
        hasError = true;
    } else if (!passwordRegex.test(password)) {
        showError("registerPasswordError", "Password must contain uppercase, lowercase, numbers, and special symbols");
        hasError = true;
    }

    if (confirmPassword !== password) {
        showError("registerConfirmPasswordError", "Passwords do not match");
        hasError = true;
    }

    if (role === "student") {
        var id = document.getElementById("studentId").value.trim();
        var email = document.getElementById("studentEmail").value.trim();
        var name = document.getElementById("studentName").value.trim();
        var phone = document.getElementById("studentPhone").value.trim();
        var dept = document.getElementById("studentDept").value.trim();

        if (!/^\d{3,7}$/.test(id)) {
            showError("studentIdError", "University ID must contain 3 to 7 digits only");
            hasError = true;
        }
        if (!email.toLowerCase().endsWith("@cit.just.edu.jo")) {
            showError("studentEmailError", "Must match student university email format (e.g. @cit.just.edu.jo)");
            hasError = true;
        }
        if (name.split(/\s+/).length !== 4) {
            showError("studentNameError", "Full Name must contain exactly 4 name parts");
            hasError = true;
        }
        if (!/^\d+$/.test(phone)) {
            showError("studentPhoneError", "Phone Number must contain numbers only");
            hasError = true;
        }
        if (!/^[a-zA-Z\s]+$/.test(dept)) {
            showError("studentDeptError", "Department must contain letters only");
            hasError = true;
        }
        
        if (hasError) return;
        userData = { id, email, name, phone, dept };
    } 
    else if (role === "supervisor" || role === "dean" || role === "head") {
        var id = document.getElementById("staffId").value.trim();
        var email = document.getElementById("staffEmail").value.trim();

        if (!id) {
            showError("staffIdError", "University ID is required");
            hasError = true;
        }
        if (!email) {
            showError("staffEmailError", "Email is required");
            hasError = true;
        } else if (role === "supervisor" && !email.toLowerCase().endsWith("@just.edu.jo")) {
            showError("staffEmailError", "Supervisor email must be a JUST university email");
            hasError = true;
        }
        if (hasError) return;
        userData = { id, email };
    } 
    else if (role === "company") {
        var commercialNumber = document.getElementById("commercialNumber").value.trim();
        var name = document.getElementById("companyName").value.trim();
        var email = document.getElementById("companyEmail").value.trim();
        var phone = document.getElementById("companyPhone").value.trim();
        var location = document.getElementById("companyLocation").value.trim();
        var field = document.getElementById("companyField").value.trim();

        if (!/^\d{5,15}$/.test(commercialNumber)) {
            showError("commercialNumberError", "Commercial Registration Number must be 5-15 digits only");
            hasError = true;
        }
        if (!/^[a-zA-Z\s]+$/.test(name) || name.length < 3) {
            showError("companyNameError", "Company Name must contain letters and spaces only, minimum 3 characters");
            hasError = true;
        }
        
        var personalDomains = ["@gmail.com", "@yahoo.com", "@outlook.com", "@hotmail.com"];
        if (!email || personalDomains.some(domain => email.toLowerCase().endsWith(domain))) {
            showError("companyEmailError", "Must be an official company email (no personal domains)");
            hasError = true;
        }
        if (!/^\d+$/.test(phone)) {
            showError("companyPhoneError", "Company Phone Number must contain numbers only");
            hasError = true;
        }
        if (!/^[a-zA-Z\s,]+$/.test(location)) {
            showError("companyLocationError", "Company Location must contain letters, spaces, and commas only");
            hasError = true;
        }
        if (!/^[a-zA-Z]+$/.test(field)) {
            showError("companyFieldError", "Specialization must contain letters only");
            hasError = true;
        }

        if (hasError) return;
        userData = { commercialNumber, name, email, phone, location, field };
    }

    fetch("http://localhost:3000/register", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ role: role, password: password, data: userData })
    })
    .then(res => res.json())
    .then(data => {
        if (data.message === "Registered successfully") {
            alert("Registered Successfully ");
            showLogin();
        } else {
            alert("Registration failed: " + (data.message || "Unknown error"));
        }
    })
    .catch(err => {
        console.log(err);
        alert("Registration failed ");
    });
}
</script>

</body>
</html>
